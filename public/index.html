<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal — Coyote</title>
    <script>
      (function () {
        var t = localStorage.getItem("coyote-theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-group">
        <button
          type="button"
          id="btn-sidebar-toggle"
          class="sidebar-mobile-toggle hidden"
          aria-label="Abrir menú"
          title="Abrir menú"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <button type="button" id="btn-brand-icon" class="btn-icon" aria-label="Ir al inicio">
          <svg
            class="brand-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 40 40"
            width="38"
            height="38"
            aria-hidden="true"
          >
            <path d="M20 2 L35 8 L35 23 Q35 34 20 39 Q5 34 5 23 L5 8 Z" fill="#4ade80"/>
            <path d="M20 6.5 L31 11 L31 23 Q31 31.5 20 35.5 Q9 31.5 9 23 L9 11 Z" fill="#86efac"/>
            <rect x="16.5" y="13.5" width="7" height="16" rx="2" fill="white"/>
            <rect x="12" y="18" width="16" height="7" rx="2" fill="white"/>
          </svg>
        </button>
        <span class="brand">Coyote — Portal médico</span>
        <button type="button" id="btn-home" class="btn-icon btn-home" aria-label="Inicio" title="Ir al inicio">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h3a1 1 0 001-1v-3h2v3a1 1 0 001 1h3a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
          </svg>
        </button>
      </div>
      <div class="topbar-right">
        <button
          type="button"
          id="btn-theme"
          class="theme-toggle"
          aria-label="Cambiar tema"
          title="Cambiar tema"
        >
          <span class="theme-icon">🌙</span>
        </button>
      </div>
    </header>
    <div class="layout">
      <aside id="sidebar" class="sidebar hidden">
        <nav class="sidebar-nav">
          <a href="#/" class="sidebar-link" data-route="dashboard">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></span>
            <span class="sidebar-label">Dashboard</span>
          </a>
          <a href="#/conversations" class="sidebar-link" data-route="conversations">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></span>
            <span class="sidebar-label">Conversaciones</span>
          </a>
          <div class="sidebar-group" data-group="chatbot">
            <button type="button" class="sidebar-group-btn" aria-expanded="false" title="Configuración chatbot">
              <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8" y2="16"></line><line x1="16" y1="16" x2="16" y2="16"></line></svg></span>
              <span class="sidebar-label">Configuración chatbot</span>
              <span class="sidebar-group-caret sidebar-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
            </button>
            <div class="sidebar-group-items">
              <a href="#/knowledge" class="sidebar-link sidebar-sublink" data-route="knowledge">
                <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></span>
                <span class="sidebar-label">Base de conocimiento</span>
              </a>
              <a href="#/prompt" class="sidebar-link sidebar-sublink" data-route="prompt">
                <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg></span>
                <span class="sidebar-label">Prompt del asistente</span>
              </a>
              <a href="#/bulk-send" class="sidebar-link sidebar-sublink" data-route="bulk-send">
                <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></span>
                <span class="sidebar-label">Envío masivo</span>
              </a>
              <a href="#/catchup" class="sidebar-link sidebar-sublink" data-route="catchup">
                <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></span>
                <span class="sidebar-label">Catchup</span>
              </a>
            </div>
          </div>
          <div class="sidebar-group" data-group="conversations-config">
            <button type="button" class="sidebar-group-btn" aria-expanded="false" title="Configuración conversaciones">
              <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span>
              <span class="sidebar-label">Configuración conversaciones</span>
              <span class="sidebar-group-caret sidebar-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
            </button>
            <div class="sidebar-group-items">
              <a href="#/classifications" class="sidebar-link sidebar-sublink" data-route="classifications">
                <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg></span>
                <span class="sidebar-label">Clasificaciones</span>
              </a>
            </div>
          </div>
        </nav>
        <div class="sidebar-footer">
          <button
            type="button"
            id="btn-sidebar-collapse"
            class="sidebar-collapse-btn"
            aria-label="Colapsar menú"
            title="Colapsar menú"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            <span class="sidebar-label">Colapsar</span>
          </button>
          <button type="button" id="btn-change-password" class="sidebar-action">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
            <span class="sidebar-label">Cambiar contraseña</span>
          </button>
          <button type="button" id="btn-logout" class="sidebar-logout">
            <span class="sidebar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>
            <span class="sidebar-label">Cerrar sesión</span>
          </button>
        </div>
      </aside>
      <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>
      <div class="layout-main">
        <main id="app" class="container"></main>
      </div>
    </div>
    <script src="/config.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
